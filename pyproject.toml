[project]
name = "embedded-lab"
version = "0.1.0"
description = "Embedded Lab is a collection of resources and tutorials for embedded systems development."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Required dependencies
    "gpiozero",
    "lgpio",
]

[dependency-groups]
dev = [
    "devtools[docs]",
]

[tool.uv.sources]
devtools = { git = "https://github.com/Dakata99/devtools.git", rev = "main" }
