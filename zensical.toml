[project]
site_name = "Embedded Lab"
site_description = "Laboratory for embedded systems development and learning."
site_url = "https://embedded-lab.github.io/"

repo_url = "https://github.com/Dakata99/embedded-lab"
repo_name = "Dakata99/embedded-lab"

docs_dir = "docs"

# ---------------------------------------------------------
# Navigation
# ---------------------------------------------------------

nav = [
    { "Home" = "index.md" },

    { "Hello world \"driver\"" = "hello-world/index.md" },

    { "LED examples" = [
        { "Overview" = "led/index.md" },
        { "LED" = "led/led.md" },
        { "3 LEDs" = "led/3leds.md" },
        { "LED client" = "led/led-client.md" },
    ] },

    { "AHT10" = [
        { "Overview" = "aht10/index.md" },
        { "Web client" = "aht10/web-client.md" },
    ] },

    { "Tips" = "tips.md" },
    { "References" = "references.md" },
]

# ---------------------------------------------------------
# Theme
# ---------------------------------------------------------

[project.theme]
variant = "modern"

features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.top",
    "search.highlight",
    "content.code.copy",
]

# Light mode
[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# Dark mode
[[project.theme.palette]]
scheme = "slate"
primary = "cyan"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

# ---------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
tables = {}

pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.snippets = {}

[project.markdown_extensions.toc]
permalink = true
